    <script>
      // Dark is the default look. Apply a saved choice before first paint so the page never flashes.
      (function () {
        var t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      })();
